<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EXIF Frame — bingkai & watermark foto</title>
    <meta name="description" content="Tambahkan bingkai dan watermark EXIF ke fotomu langsung di browser. Tanpa upload, tanpa server." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <header class="top">
      <h1>EXIF Frame</h1>
      <p>Bingkai &amp; watermark EXIF. Foto diproses di browser, tidak diunggah ke mana pun.</p>
    </header>

    <main class="layout">
      <aside class="panel">
        <label class="drop" id="drop">
          <input id="file" type="file" accept="image/jpeg,image/png,image/webp" multiple hidden />
          <strong>Pilih foto</strong>
          <span>atau seret ke sini (bisa banyak sekaligus)</span>
        </label>

        <div class="thumbs" id="thumbs"></div>

        <section class="group">
          <h2>Template</h2>
          <div class="seg" id="template">
            <button data-v="classic" class="on">Klasik</button>
            <button data-v="center">Tengah</button>
            <button data-v="oneline">Satu baris</button>
            <button data-v="overlay">Overlay</button>
          </div>
          <div class="seg" id="theme">
            <button data-v="light" class="on">Putih</button>
            <button data-v="dark">Hitam</button>
          </div>
          <label class="row">Ukuran teks
            <input id="scale" type="range" min="0.6" max="1.8" step="0.05" value="1" />
          </label>
          <label class="check"><input id="showLens" type="checkbox" checked /> Tampilkan lensa</label>
          <label class="check"><input id="showDate" type="checkbox" checked /> Tampilkan tanggal</label>
          <label class="field">Teks tambahan / tanda tangan
            <input id="signature" type="text" placeholder="mis. © Farid" />
          </label>
        </section>

        <section class="group">
          <h2>Data foto ini <small>(bisa diedit)</small></h2>
          <label class="field">Kamera <input id="m-camera" type="text" /></label>
          <label class="field">Lensa <input id="m-lens" type="text" /></label>
          <label class="field">Parameter <input id="m-params" type="text" /></label>
          <label class="field">Tanggal <input id="m-date" type="text" /></label>
        </section>

        <section class="group">
          <h2>Ekspor</h2>
          <div class="seg" id="format">
            <button data-v="jpeg" class="on">JPEG</button>
            <button data-v="png">PNG</button>
          </div>
          <label class="row" id="qualityRow">Kualitas JPEG
            <input id="quality" type="range" min="0.7" max="1" step="0.01" value="0.95" />
          </label>
          <div class="actions">
            <button id="dlOne" class="primary" disabled>Unduh foto ini</button>
            <button id="dlAll" disabled>Unduh semua (ZIP)</button>
          </div>
          <p class="status" id="status"></p>
        </section>
      </aside>

      <section class="stage">
        <div class="empty" id="empty">Belum ada foto. Pilih atau seret foto ke panel kiri.</div>
        <canvas id="preview" hidden></canvas>
      </section>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
